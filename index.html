<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicorn7Love Chess Bot</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div class="coins-display">
        💰 <span id="coinsAmount">0</span>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <img src="/static/img/logo.png" alt="Logo" class="logo">
            <h1 class="app-title">Unicorn7Love Chess</h1>
        </div>

        <!-- Navigation -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-page="profile">👤 Профиль</button>
            <button class="nav-tab" data-page="leaderboard">🏆 Топы</button>
            <button class="nav-tab" data-page="chess">♟️ Игра</button>
            <button class="nav-tab" data-page="shop">🛒 Магазин</button>
        </div>

        <!-- Profile Page -->
        <div id="profile" class="page active">
            <div class="profile-banner"></div>

            <div class="profile-info">
                <img id="userAvatar" src="/static/img/default-avatar.png" alt="Avatar" class="avatar">
                <div class="user-details">
                    <h2 id="username">Загрузка...</h2>
                    <div id="userTitle" class="user-title">Новичок</div>
                </div>
            </div>

            <div class="level-section">
                <div class="level-info">
                    <div id="userLevel" class="level-badge">Уровень 0</div>
                    <div class="xp-info">
                        <span id="currentXp">0</span> / <span id="neededXp">50</span> XP
                    </div>
                </div>
                <div class="progress-bar">
                    <div id="xpProgress" class="progress-fill" style="width: 0%"></div>
                </div>
            </div>

            <div class="ratings-grid">
                <div class="rating-card">
                    <img src="/static/img/bullet.png" alt="Bullet" class="rating-icon">
                    <div class="rating-type">Пуля</div>
                    <div id="bulletRating" class="rating-value">—</div>
                </div>
                <div class="rating-card">
                    <img src="/static/img/blitz.png" alt="Blitz" class="rating-icon">
                    <div class="rating-type">Блиц</div>
                    <div id="blitzRating" class="rating-value">—</div>
                </div>
                <div class="rating-card">
                    <img src="/static/img/rapid.png" alt="Rapid" class="rating-icon">
                    <div class="rating-type">Рапид</div>
                    <div id="rapidRating" class="rating-value">—</div>
                </div>
                <div class="rating-card">
                    <img src="/static/img/classical.png" alt="Classical" class="rating-icon">
                    <div class="rating-type">Классика</div>
                    <div id="classicalRating" class="rating-value">—</div>
                </div>
            </div>
        </div>

        <!-- Leaderboard Page -->
        <div id="leaderboard" class="page">
            <div class="leaderboard-table">
                <div class="table-header">
                    <div>Место</div>
                    <div>Игрок</div>
                    <div>Уровень</div>
                    <div>Очки</div>
                </div>
                <div id="leaderboardBody">
                    <!-- Dynamic content -->
                </div>
            </div>
        </div>

        <!-- Chess Game Page -->
        <div id="chess" class="page">
            <div class="chess-container">
                <div class="opponent-info">
                    <img src="/static/img/bot-avatar.png" alt="Bot" class="bot-avatar">
                    <div>
                        <div class="difficulty-badge difficulty-novice">Новичок</div>
                        <div>Stockfish • 1250 ELO</div>
                    </div>
                </div>

                <div id="chessBoard" class="chessboard">
                    <!-- Dynamic chess board -->
                </div>

                <div class="game-controls">
                    <button id="newGame" class="game-button">Новая игра</button>
                    <button id="resign" class="game-button" style="display: none;">Сдаться</button>
                </div>

                <div class="player-info">
                    <div id="playerTitle" class="user-title">Шахматный Энтузиаст</div>
                    <div id="playerName">Unicorn7Love</div>
                    <div id="playerRating">1456 • Lichess</div>
                </div>
            </div>
        </div>

        <!-- Shop Page -->
        <div id="shop" class="page">
            <div class="shop-categories">
                <button class="category-btn active">Все</button>
                <button class="category-btn">Кастомизация</button>
                <button class="category-btn">Эффекты</button>
            </div>

            <div id="shopItems" class="shop-items">
                <!-- Dynamic shop items -->
            </div>
        </div>
    </div>

    <!-- Purchase Modal -->
    <div id="purchaseModal" class="modal">
        <div class="modal-content">
            <h3>Купить предмет</h3>
            <input type="url" placeholder="Вставьте ссылку на изображение">
            <div class="modal-buttons">
                <button class="cancel-btn">Отмена</button>
                <button class="confirm-btn">Купить</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
